<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Bó – svislý layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================
   RESET / BASE
   ========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #f6f7f9;
  color: #222;
}

/* =========================
   APP LAYOUT (4 ZÓNY)
   ========================= */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: 240px 1fr;
  grid-template-areas:
    "header header"
    "nav    main"
    "footer footer";
}

/* =========================
   HEADER
   ========================= */
.header {
  grid-area: header;
  background: #fff;
  padding: 12px 16px;
  border-bottom: 1px solid #ccc;
}

/* =========================
   NAV (MENU)
   ========================= */
.nav {
  grid-area: nav;
  background: #dcdcdc;
  padding: 12px 0;
}

/* =========================
   MAIN MENU
   ========================= */
.menu {
  list-style: none;
}

.menu-item {
  background: #cfcfcf;
  border-top: 1px solid #bbb;
}

.menu-item > a {
  display: block;
  padding: 14px 18px;
  text-decoration: none;
  color: #000;
  font-weight: 600;
}

/* hover */
.menu-item:hover {
  background: #bfbfbf;
}

/* =========================
   ACTIVE STATES
   ========================= */

/* aktivní BEZ submenu = bílý list */
.menu-item.active.no-submenu {
  background: #fff;
}

/* aktivní SE submenu = zůstává šedý */
.menu-item.active.has-submenu {
  background: #cfcfcf;
}

/* =========================
   SUBMENU
   ========================= */
.submenu {
  list-style: none;
  background: #dcdcdc;
  padding: 8px 0 12px 16px;
}

/* položky submenu */
.submenu-item a {
  display: block;
  padding: 10px 14px;
  margin-bottom: 4px;
  background: #e6e6e6;
  border: 1px solid #bbb;
  border-left: 4px solid transparent;
  text-decoration: none;
  color: #000;
  font-size: 14px;
}

/* hover submenu */
.submenu-item a:hover {
  background: #d0d0d0;
}

/* aktivní submenu = skutečný list */
.submenu-item.active a {
  background: #fff;
  border-left-color: #999;
}

/* =========================
   MAIN CONTENT
   ========================= */
.main {
  grid-area: main;
  background: #fff;
  padding: 20px;
}

/* =========================
   FOOTER
   ========================= */
.footer {
  grid-area: footer;
  background: #f0f0f0;
  padding: 10px 16px;
  font-size: 13px;
  opacity: .7;
  border-top: 1px solid #ccc;
}

/* =========================
   RESPONSIVE – MOBILE
   ========================= */
@media (max-width: 768px) {

  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas:
      "header"
      "nav"
      "main"
      "footer";
  }

  .nav {
    padding: 8px 0;
    border-bottom: 1px solid #bbb;
  }

  /* menu přes celou šířku */
  .menu-item > a {
    padding: 14px 16px;
  }

  /* submenu víc odsazené, ať je jasná hierarchie */
  .submenu {
    padding-left: 24px;
  }

}

</style>
</head>

<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <small>Přihlášen: Petr Vaněk (admin)</small>
  </header>

  <!-- NAV -->
  <nav class="nav">
    <ul class="menu">

      <li class="menu-item no-submenu">
        <a href="#">Dashboard</a>
      </li>

      <li class="menu-item active has-submenu">
        <a href="#">Zakázky</a>

        <ul class="submenu">
          <li class="submenu-item active">
            <a href="#">Přehled</a>
          </li>
          <li class="submenu-item">
            <a href="#">Nová zakázka</a>
          </li>
          <li class="submenu-item">
            <a href="#">Archiv</a>
          </li>
        </ul>
      </li>

      <li class="menu-item no-submenu">
        <a href="#">Úkoly</a>
      </li>

      <li class="menu-item no-submenu">
        <a href="#">Administrace</a>
      </li>

    </ul>
  </nav>

  <!-- CONTENT -->
  <main class="main">
    <h1>Zakázky – Přehled</h1>
    <p>
      Bílá stránka navazuje **jen na aktivní submenu**.  
      Hlavní menu je „držák šanonu“.
    </p>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    Vytvořil Petr Vaněk & Bó · 2026
  </footer>

</div>
</body>
</html>
